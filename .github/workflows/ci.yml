name: Flight Dynamics CI

on:
  push:
    branches: [ "main", "Experimental" ]
  pull_request:
    branches: [ "main", "Experimental" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.12"
            lock: requirements-py312.lock
          - python: "3.14"
            lock: requirements-py314.lock
    env:
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: 'pip'
        cache-dependency-path: requirements-*.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --require-hashes -r ${{ matrix.lock }}
        python -m pip install --no-deps --no-build-isolation -e .

    - name: Static checks and function reference
      run: |
        python -m ruff check source MAGI projects scripts tests setup.py
        python scripts/generate_function_reference.py --check

    - name: Run Tests
      run: |
        python -m pytest tests/ MAGI/tests/ -m "not gui" --cov=antares_fd --cov-report=xml --cov-report=term

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python }}
        path: coverage.xml
  station-browser:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      ANTARES_GUI_EVIDENCE_DIR: docs/evidence/gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --require-hashes -r requirements-py314.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip install 'playwright==1.65.2'
          python -m playwright install --with-deps chromium
      - run: python -m pytest tests/integration/test_station_browser.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-browser-evidence
          path: docs/evidence/gui/
