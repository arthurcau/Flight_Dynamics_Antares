# Flight Dynamics & Systems Engineering Requirements Registry
# This file serves as the singular source of truth for margin tracking and status vocabulary.

requirements:
  FD-REQ-001:
    description: "Launch Rail Exit Velocity"
    metric: "rail_exit_velocity"
    operator: ">="
    limit: 25.0
    tolerance: 5.0
    unit: "m/s"
    source_type: "FORMAL_REQUIREMENT"
    source: "LASC 2027 Section 4.2 / Range Safety"
    revision: "2027.1"
    notes: "Requires enough speed to overcome aerodynamic tip-off upon rod departure."

  FD-REQ-002:
    description: "Rail Exit Static Stability Margin"
    metric: "static_margin_rail_exit"
    operator: ">="
    limit: 1.5
    tolerance: 0.5
    unit: "cal"
    source_type: "FORMAL_REQUIREMENT"
    source: "SAC Rules Section 3.1 / Range Safety"
    revision: "v4"
    notes: "Assures positive stability upon rail departure."

  STR-REQ-001:
    description: "Propulsion Ascent Acceleration Envelope"
    metric: "max_total_acceleration"
    operator: "<="
    limit: 20.0
    tolerance: 2.0
    unit: "g"
    source_type: "FORMAL_REQUIREMENT"
    source: "Antares Structural Envelope Specification"
    revision: "A"
    notes: "Peak structural load qualification envelope. Evaluated only during ascent."

  AER-REQ-001:
    description: "Maximum Dynamic Pressure (Max-Q)"
    metric: "max_dynamic_pressure"
    operator: "<="
    limit: 45000.0
    tolerance: 5000.0
    unit: "Pa"
    source_type: "ENGINEERING_GUIDELINE"
    source: "Airframe Skin Buckling / Fin Flutter Analysis"
    revision: "B"
    notes: "Guideline envelope to prevent exceeding the modeled flutter margins."

  REC-REQ-001:
    description: "Drogue Deployment Timing vs Apogee"
    # To properly evaluate this, we will need to compute this indirectly or just evaluate `drift_at_apogee` or something.
    # Currently, I'll bound drogue descent rate.
    metric: "drogue_descent_rate"
    operator: "<="
    limit: 30.0
    tolerance: 5.0
    unit: "m/s"
    source_type: "FORMAL_REQUIREMENT"
    source: "SAC Recovery Rules"
    revision: "v4"
    notes: "Bound descent speed prior to main deploy."

  REC-REQ-002:
    description: "Touchdown Vertical Sink Rate"
    metric: "touchdown_velocity"
    operator: "<="
    limit: 8.0
    tolerance: 2.0
    unit: "m/s"
    source_type: "FORMAL_REQUIREMENT"
    source: "LASC Range Safety"
    revision: "2027.1"
    notes: "Ensures survivability of internal payloads."

  REC-REQ-003:
    description: "Touchdown Kinetic Energy"
    metric: "touchdown_energy"
    operator: "<="
    limit: 1500.0
    tolerance: 0.0
    unit: "J"
    source_type: "ENGINEERING_GUIDELINE"
    source: "Ground Hazard Assessment Matrix"
    revision: "1"
    notes: "Guidance rule limiting energy applied against terrain / range footprint."

model_validity:
  VAL-AER-001:
    description: "Flight Mach Regime"
    metric: "max_mach"
    operator: "<="
    limit: 0.80
    unit: "M"
    notes: "Subsonic linear aero database validity bound."

  VAL-AER-002:
    description: "Maximum Assumed Angle of Attack (Ascent)"
    metric: "max_angle_of_attack"
    operator: "<="
    limit: 10.0
    unit: "deg"
    notes: "Barrowman approximations / thin-airfoil theory validity."
