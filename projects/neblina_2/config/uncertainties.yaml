schema_version: 1
uncertainties:
  launch_inclination:
    enabled: false
    nominal_yaml_path: launch.rail.inclination_deg
    units: deg
    distribution: uniform
    min: 70.0
    max: 90.0
    provenance:
      source: None
      type: LEGACY_ASSUMPTION
      confidence: low
      notes: Arbitrary engineering limits until rail setup procedure is formalised.
  launch_heading:
    enabled: false
    nominal_yaml_path: launch.rail.heading_deg
    units: deg
    distribution: uniform
    min: 230.0
    max: 250.0
    provenance:
      source: None
      type: LEGACY_ASSUMPTION
      confidence: low
      notes: Bound assumption based on range envelope constraints.
  power_off_drag_multiplier:
    enabled: false
    units: dimensionless
    distribution: normal
    mean: 1.0
    sigma: 0.1
    provenance:
      source: None
      type: LEGACY_ASSUMPTION
      confidence: low
      notes: Arbitrary 10% sigma multiplier on nominal Cd curve. Needs OpenRocket/CFD
        bounds.
  power_on_drag_multiplier:
    enabled: false
    units: dimensionless
    distribution: normal
    mean: 1.0
    sigma: 0.1
    provenance:
      source: None
      type: LEGACY_ASSUMPTION
      confidence: low
      notes: Arbitrary 10% sigma multiplier. Should correlate with power-off discrepancy
        later.
  vehicle_mass:
    enabled: false
    nominal_yaml_path: vehicle.mass_properties.mass_without_motor
    units: kg
    distribution: normal
    mean: 21.186
    sigma: 0.01
    provenance:
      source: None
      type: LEGACY_ASSUMPTION
      confidence: low
      notes: Arbitrary mass sigma (10g). Extremely low; needs repeated physical scale
        metrology.
  total_impulse_multiplier:
    enabled: false
    units: dimensionless
    distribution: normal
    mean: 1.0
    sigma: 0.05
    provenance:
      source: None
      type: LEGACY_ASSUMPTION
      confidence: low
      notes: Assumed 5% impulse variation. Requires replacement with genuine static
        fires.
  atmosphere_ensemble:
    enabled: false
    units: categorical
    distribution: categorical
    provenance:
      source: MAGI
      type: NATIVE_MODEL_ENSEMBLE
      confidence: moderate
      notes: Samples distinct forecast members rather than artificial random factors.
  site_elevation:
    enabled: false
    nominal_yaml_path: launch.site.elevation
    units: m
    distribution: normal
    mean: 495.0
    sigma: 5.0
    provenance:
      source: None
      type: LEGACY_ASSUMPTION
      confidence: low
      notes: Assumed DEM error model.
notes: Distribuições herdadas desabilitadas até revisão do novo modelo; não são medições
  do Neblina 2.
